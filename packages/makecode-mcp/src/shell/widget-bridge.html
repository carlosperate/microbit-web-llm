<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MakeCode session</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      body { display: flex; flex-direction: column; }
      #status {
        display: none;
        padding: 0.5rem 0.75rem;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff4e5;
        color: #7a4b00;
        border-bottom: 1px solid #f0d9b5;
      }
      #status.err { background: #fdecea; color: #a4262c; border-bottom-color: #f3c6c3; }
      #status.on { display: block; }
      #mk { flex: 1 1 auto; width: 100%; border: 0; }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <iframe id="mk" allow="usb; serial"></iframe>
    <!-- Inline so it fires even if the shim fails: the widget uses this to
         tell "host blocked the frame" from "frame loaded but broke". -->
    <script>
      if (window.parent !== window) {
        window.parent.postMessage({ type: "mkcp-bridge-loaded" }, "*");
      }
    </script>
    <script type="module" src="./widget-shim.js"></script>
  </body>
</html>
