<!doctype html>
<!-- makecode-session-editor:v2 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MakeCode Session</title>
    <style>
      /* min-height, not height:100%: the host sizes the frame from our
         size-changed request, and a percentage of a short frame collapses. */
      html, body { margin: 0; padding: 0; background: #fff; }
      body { display: flex; flex-direction: column; min-height: 720px;
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .status { padding: 0.75rem 1rem; color: #666; font-size: 0.9rem; text-align: center; }
      .status.err { color: #a4262c; }
      .status.hidden { display: none; }
      #editor { flex: 1 1 auto; min-height: 680px; display: flex; }
      #editor iframe { flex: 1 1 auto; width: 100%; border: 0; }
    </style>
  </head>
  <body>
    <div id="status" class="status">Connecting to the host…</div>
    <div id="editor"></div>
    <!--
      MakeCode runs in a blob iframe built by the script below, not framed from
      our server: hosts allow `blob:` in frame-src but not third-party origins,
      and a blob frame is a real iframe, which is all MakeCode requires before
      it will accept controller messages. The script is inlined because
      'unsafe-inline' is always permitted while our origin may not be in
      script-src.
    -->
    <script>window.__mkcpConfig = __MKCP_CONFIG__;</script>
    <script>__MKCP_APP_JS__</script>
  </body>
</html>
